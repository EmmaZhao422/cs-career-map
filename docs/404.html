  h1 { font: 800 clamp(2.3rem, 6.2vw, 4.4rem)/1.02 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.03em; margin: 2.5rem 0 1.25rem; }

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <a class="brand home-link" href="./">CS Career Map</a>
  <main id="main" tabindex="-1">
    <h1>No <span class="mark">such</span> page</h1>

    <p class="links"><a class="home-link" href="./">Go to the home page</a></p>

<script>
  // GitHub Pages serves this page for any missing address, however deep. On a project site
  // the home page is the first path segment, so point the home links there.
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    var first = location.pathname.split("/")[1];
    var home = first ? "/" + first + "/" : "/";
    [].forEach.call(document.querySelectorAll(".home-link"), function (a) { a.setAttribute("href", home); });
  })();
</script>
