name: Refresh job posting data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "collector/collect.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s collector
      - name: Read job boards and rebuild site data
        run: python collector/collect.py collect
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data skill/cs-career-coach/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh job posting data"
            git pull --rebase --quiet origin main
            git push
          fi

  # A push made by a workflow does not start other workflows, so the refreshed
  # site is published here.
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
